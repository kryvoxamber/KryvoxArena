# Supabase local/project config. Secrets are read from the environment, never written here.
project_id = "kryvox-arena"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/login", "http://localhost:3000/profile/setup"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "5MiB"

# Edge Functions are added in later stages (payments, email, OTP). JWT verification stays ON by default;
# only webhook endpoints (signature-verified inside the function) will set verify_jwt = false.

# Webhooks are called by PhonePe / Razorpay without a Supabase JWT; they authenticate by signature/shared secret inside the function.
[functions.razorpay-webhook]
verify_jwt = false
[functions.phonepe-webhook]
verify_jwt = false
# cron-triggered functions authenticate with x-cron-secret (or a staff JWT) inside the function
[functions.payment-reconcile]
verify_jwt = false
[functions.email-worker]
verify_jwt = false
